name: Build firmware matrix

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/firmware-matrix.yml"
      - "platformio.ini"
      - "version"
      - "src/**"
      - "ci/firmware_matrix.json"
      - "ci/firmware_matrix.py"
      - "ci/test_firmware_matrix.py"
      - "which_to_choose_*.txt"
  workflow_dispatch:
    inputs:
      release_label:
        description: Optional label used in release asset filenames
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: firmware-matrix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Validate configuration table
        run: |
          python ci/firmware_matrix.py validate
          python ci/test_firmware_matrix.py
      - name: Create build matrix
        id: matrix
        run: echo "matrix=$(python ci/firmware_matrix.py matrix)" >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.platformio/.cache
            ~/.platformio/packages
          key: ${{ runner.os }}-pio-${{ hashFiles('platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-pio-
      - name: Install PlatformIO Core
        run: python -m pip install --upgrade platformio
      - name: Build 65 firmware variants
        run: >-
          python ci/firmware_matrix.py build
          --profile "${{ matrix.profile }}"
          --autoload "${{ matrix.autoload }}"
          --rgb "${{ matrix.rgb }}"
          --output dist
      - name: Upload matrix shard
        uses: actions/upload-artifact@v4
        with:
          name: firmware-shard-${{ matrix.profile }}-autoload${{ matrix.autoload }}-rgb${{ matrix.rgb }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  package:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Download all matrix shards
        uses: actions/download-artifact@v4
        with:
          pattern: firmware-shard-*
          path: dist
          merge-multiple: true
      - name: Verify and merge manifests
        run: |
          python ci/firmware_matrix.py merge --root dist
          mkdir -p dist/guides
          cp which_to_choose_*.txt dist/guides/
          cp docs/FIRMWARE_BUILD_MATRIX.md dist/
      - name: Prepare release assets
        run: >-
          python ci/firmware_matrix.py package-release
          --root dist
          --output release-assets
          --label "${{ inputs.release_label }}"
      - name: Upload release-ready assets
        uses: actions/upload-artifact@v4
        with:
          name: release-ready-${{ github.sha }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 1
